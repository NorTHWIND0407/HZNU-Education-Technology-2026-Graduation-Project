<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800' viewBox='0 0 1200 800'>
  <defs>
    <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#0f1115'/>
      <stop offset='1' stop-color='#171a21'/>
    </linearGradient>
    <filter id='noise'>
      <feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/>
      <feColorMatrix type='saturate' values='0'/>
      <feComponentTransfer><feFuncA type='table' tableValues='0 0.08'/></feComponentTransfer>
    </filter>
  </defs>
  <rect width='1200' height='800' fill='url(#g)'/>
  <rect width='1200' height='800' filter='url(#noise)'/>
  <g font-family='"Noto Sans", "Microsoft YaHei", Arial' fill='#d4af37' text-anchor='middle'>
    <text x='600' y='380' font-size='56' font-weight='700'>临平滚灯</text>
    <text x='600' y='430' font-size='22' opacity='.9'>占位图 · 替换为你的图片</text>
  </g>
</svg>

